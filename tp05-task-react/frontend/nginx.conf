server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Las llamadas a la API se reenvian al contenedor "api" (el nombre del servicio en
    # docker-compose.yml funciona como host dentro de la red de Compose).
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Todo lo demas son archivos estaticos del build de Vite; si no existe el archivo
    # se devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
